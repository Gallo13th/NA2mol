# NA2smol runtime environment (conda).
#
# THE CONDA ENVIRONMENT IS REQUIRED. The system Python cannot run this project:
# the model imports torch_scatter and torch_geometric, and molecule reconstruction
# imports OpenBabel. Both are installed here and nowhere else.
#
#   conda env create -f environment.yml     # creates the `rna2smol` env
#   conda activate rna2smol
#   python -c "import torch, torch_scatter, openbabel; print('ok')"
#
# Exported with `conda env export -n rna2smol --no-builds`, so versions are pinned
# but build strings are not (portable across platforms with the same versions).
#
# The channels below are Tsinghua mirrors. Outside CN, replace the
# mirrors.tuna.tsinghua.edu.cn entries with `defaults` and `conda-forge`.
#
# Note: the PyPI section pins CUDA 11.8 wheels (torch==2.3.1+cu118). On a
# CPU-only host, install torch from the CPU index instead.
name: rna2smol
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - conda-forge
  - defaults
  - bioconda
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/
